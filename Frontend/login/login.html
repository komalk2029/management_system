<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>

  <link rel="stylesheet" href="login.css">
</head>

<body>

<div class="root">

  <div class="auth-options">
    <h2>YOUR ACCOUNT ALREADY EXISTS!!</h2>

    <form class="formcont">

      <label>
        <span class="label">Email</span>
        <input type="email" class="inp email">
      </label>

      <label>
        <span class="label">Password</span>
        <input type="password" class="inp pass">
      </label>

      <button class="sub-btn" type="submit">Login</button>

    </form>
  </div>

  <div class="feature-image">
    <img src="login.jpg" class="image" alt="login">
  </div>

</div>

<div id="rj-tost" class="close"></div>

<script src="login.js"></script>

</body>
</html>
